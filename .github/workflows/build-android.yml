name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "incoming/**"
      - "tools/**"
      - "art/**"
      - ".github/workflows/ai-images.yml"
      - ".github/workflows/images.yml"
      - ".github/workflows/videos.yml"

jobs:
  # الجسم الحي: يجهز هيكل أي صورة جديدة أو معدلة تلقائياً (الصور اللي ما تغيرت تنتخطى)
  autorig:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install "mediapipe==0.10.14" "numpy<2" scipy pillow
      - name: Rig new or changed images
        run: python tools/autorig/run.py
      - name: Keep rigs for the build
        uses: actions/upload-artifact@v4
        with:
          name: rigs
          path: assets/rig/
          if-no-files-found: ignore

  build-apk:
    needs: autorig
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get fresh rigs
        uses: actions/download-artifact@v4
        with:
          name: rigs
          path: assets/rig/
        continue-on-error: true

      - name: Validate project files
        run: |
          test -f project.godot && test -f main.tscn && test -f main.gd && test -f free_roam.gd
          test "$(find assets/layan_outfits -maxdepth 1 -name '[0-9][0-9]_*.png' | wc -l)" -ge 12

      - name: Setup Android signing and editor settings
        run: |
          # godot-ci keeps export templates under /root, but GitHub sets HOME=/github/home
          echo "HOME=$HOME"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ ! -d "$HOME/.local/share/godot/export_templates/4.4.1.stable" ]; then
            cp -r /root/.local/share/godot/export_templates/4.4.1.stable "$HOME/.local/share/godot/export_templates/"
          fi
          ls "$HOME/.local/share/godot/export_templates/4.4.1.stable" | grep android
          rm -f /root/debug.keystore
          keytool -genkeypair -v -keystore /root/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JAVA="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          echo "SDK=$SDK JAVA=$JAVA"
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$SDK\""
            echo "export/android/java_sdk_path = \"$JAVA\""
            echo 'export/android/debug_keystore = "/root/debug.keystore"'
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.4.tres

      - name: Import Godot resources
        run: godot --headless --path . --import

      - name: Export debug APK
        run: |
          mkdir -p build
          set +e
          godot --headless --path . --verbose --export-debug Android build/HikayatBaytna.apk > export.log 2>&1
          rc=$?
          grep -v -e first_scan -e loading_editor export.log | tail -c 3500 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' > ann.txt
          echo "::error title=export-log::$(cat ann.txt)"
          ls -la build || true
          exit $rc

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HikayatBaytna-Android-APK
          path: build/HikayatBaytna.apk
          if-no-files-found: error
