name: AI Art (draw game images)
# يرسم صور اللعبة بالذكاء الاصطناعي على GitHub (بدون كرت شاشة) ويحط النتائج في فرع art-output
on:
  workflow_dispatch:
    inputs:
      only:
        description: "أسماء الصور المطلوبة مفصولة بفاصلة (فاضي = الكل)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-dreamshaper8-v1
      - name: Install
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "diffusers==0.30.3" "transformers==4.44.2" accelerate safetensors pillow
      - name: Draw
        run: python art/gen.py ${{ matrix.shard }} 8 "${{ github.event.inputs.only }}"
      - uses: actions/upload-artifact@v4
        with:
          name: art-${{ matrix.shard }}
          path: art_out/
          if-no-files-found: ignore

  publish:
    needs: draw
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art_out
          merge-multiple: true
      - name: Push images to art-output branch
        run: |
          ls -la art_out || exit 0
          git init -q out && cd out
          git config user.name "art-bot"
          git config user.email "art-bot@users.noreply.github.com"
          mkdir -p art_out && cp ../art_out/*.png art_out/ 2>/dev/null || true
          git checkout -q -b art-output
          git add -A
          git commit -q -m "AI art run ${{ github.run_id }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" art-output
