name: Test picture to 3D (TripoSR on CPU)
# تجربة مؤقتة: يحوّل الصور اللي في photos/ لمجسمات 3D ملونة بدون كرت شاشة، وينشر النتيجة في فرع test-3d-out
on:
  push:
    branches: [test-3d]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install TripoSR (CPU)
        run: |
          python -m pip install --upgrade pip setuptools wheel > /dev/null
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu > /dev/null
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR tsr
          sed -i '/torchmcubes/d' tsr/requirements.txt
          pip install -r tsr/requirements.txt > pip.txt 2>&1 || (tail -40 pip.txt; exit 1)
          pip install cmake scikit-build scikit-build-core pybind11 ninja > /dev/null
          pip install --no-build-isolation git+https://github.com/tatsy/torchmcubes.git > mc.txt 2>&1 || (tail -40 mc.txt; exit 1)
          pip install onnxruntime > /dev/null
          python -c "import torchmcubes, onnxruntime; print('deps ok')"
      - name: Convert
        run: |
          mkdir -p out
          cd tsr
          python run.py --help > ../out/help.txt 2>&1 || true
          for f in ../photos/*.png; do
            n=$(basename "$f" .png); mkdir -p ../out/$n/0
            /usr/bin/time -v python run.py "$f" --device cpu --no-remove-bg --foreground-ratio 0.9 --mc-resolution 256 \
              --model-save-format glb --output-dir ../out/$n > ../out/$n.log 2>&1 || true
            tail -25 ../out/$n.log
          done
          ls -laR ../out
      - name: Publish results
        if: always()
        run: |
          mkdir -p out && cp pip.txt mc.txt out/ 2>/dev/null || true
          cd out
          git init -q && git checkout -q -b test-3d-out
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "TripoSR test ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-3d-out
